{% extends 'base.html' %}

{% block content %}
<h1 class="title is-4">Batch Preview Regeneration</h1>
<p class="help">Select generated assets and enqueue preview generation (staff only).</p>
<form id="batch-form" method="post" action="{% url 'editor:batch_enqueue_previews' %}">
  {% csrf_token %}
  <div class="columns is-multiline">
    {% for a in assets %}
    <div class="column is-one-quarter">
      <label class="card" style="padding:0;">
        <div class="card-image">
          <figure class="image is-4by3">
            {% if a.preview_image %}
              <img src="{{ a.preview_image.url }}" alt="{{ a.title }}">
            {% else %}
              <img src="{{ a.image.url }}" alt="{{ a.title }}">
            {% endif %}
          </figure>
        </div>
        <div class="card-content">
          <div class="content">
            <input type="checkbox" name="asset_ids" value="{{ a.id }}"> {{ a.title }}
          </div>
        </div>
      </label>
    </div>
    {% endfor %}
  </div>
  <div class="field">
    <div class="control">
      <button class="button is-primary" type="submit">Enqueue selected</button>
    </div>
  </div>
</form>

<div id="batch-results" style="margin-top:1rem;"></div>

<script>
document.getElementById('batch-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const form = e.target;
  const data = new FormData(form);
  const resp = await fetch(form.action, {method:'POST', body: data, headers: {'X-Requested-With':'XMLHttpRequest', 'X-CSRFToken': (document.cookie.match('(^|;)\\s*csrftoken\\s*=\\s*([^;]+)')||[]).pop()}});
  if (!resp.ok) {
    const t = await resp.text();
    alert('Batch enqueue failed: ' + t);
    return;
  }
  const j = await resp.json();
  if (j.status !== 'ok') {
    alert('Error: ' + JSON.stringify(j));
    return;
  }
  const container = document.getElementById('batch-results');
  container.innerHTML = '';
  for (const r of j.results) {
    const div = document.createElement('div');
    if (r.error) {
      div.textContent = `Asset ${r.asset_id}: ERROR ${r.error}`;
    } else {
      div.textContent = `Asset ${r.asset_id}: ${r.enqueued ? 'enqueued' : 'generated locally'}`;
      if (r.preview_url) {
        const img = document.createElement('img'); img.style.maxWidth='200px'; img.style.display='block'; img.src = r.preview_url + '?v=' + Date.now();
        div.appendChild(img);
      }
    }
    container.appendChild(div);
  }
});
</script>

{% endblock %}
